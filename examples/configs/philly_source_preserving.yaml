version: 1

source:
  format: philly
  trace_path: data/raw/philly/cluster_job_log
  cluster_name: philly

mapping:
  workload_catalog_path: outputs/workload_catalog.csv
  seed: 42
  num_jobs: 60

  supported_gpu_counts:
    - 1
    - 2

  minimum_jobs_by_gpu_count:
    2: 2


  maximum_gpu_fraction_deviation: 0.05
  maximum_runtime_cdf_deviation: 0.10
  
  gpu_demand_matching: exact
  duration_matching: nearest_quantile
  unsupported_gpu_policy: filter
  preserve_arrivals: true
  selection_method: representative



simulation:
  enabled: true
  server_gpu_count: 3
  
output:
  trace_path: outputs/generated_traces/philly_seed42_60jobs.csv
  manifest_path: outputs/generated_traces/philly_seed42_60jobs.manifest.json


